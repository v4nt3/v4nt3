<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <polygon points="30,4 34,24 54,24 38,36 44,56 30,44 16,56 22,36 6,24 26,24"
    fill="#e3b341" stroke="none">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 30 30"
      to="360 30 30"
      dur="4s"
      repeatCount="indefinite"/>
    <animate
      attributeName="opacity"
      values="1;0.6;1;0.8;1"
      dur="2s"
      repeatCount="indefinite"/>
  </polygon>
  <polygon points="30,12 32.5,22 42,22 34.5,27.5 37,37 30,31.5 23,37 25.5,27.5 18,22 27.5,22"
    fill="#f0c84a" stroke="none">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 30 30"
      to="0 30 30"
      dur="4s"
      repeatCount="indefinite"/>
  </polygon>
</svg>
